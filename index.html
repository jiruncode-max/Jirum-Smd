<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TikTok Live Gift Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Panel Kontrol Utama -->
    <div id="controlPanel" class="panel">
        <h2>TikTok Live Controller</h2>
        <div class="input-group">
            <input type="text" id="liveStreamNameInput" placeholder="Masukkan Username TikTok (contoh: @username)">
            <button id="startLiveBtn">Mulai Hubungkan</button>
            <button id="stopLiveBtn" class="danger">Putuskan</button>
        </div>
        <div id="liveBridgeError" class="error-text"></div>
    </div>

    <!-- Area Notifikasi Melayang (Floating Gift Notifications) -->
    <div id="floatingGiftContainer" class="floating-container"></div>

    <!-- Halaman Riwayat Gift -->
    <div id="giftHistoryPage" class="panel hidden">
        <h3>Riwayat Gift Masuk</h3>
        <ul id="giftHistoryList"></ul>
    </div>

    <!-- Script Utama -->
    <script src="app.js"></script>
</body>
</html>
