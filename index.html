    /* ===== KUNCI: halaman tidak bisa di-scroll ===== */
    html, body {
      height: 100%;
      overflow: hidden;              /* blokir scroll halaman */
      overscroll-behavior: none;     /* hilangkan efek bounce/tarik */
    }

    /* Scrollbar disembunyikan (untuk area yang menggulir internal) */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      box-shadow: inset 0 0 0 2px #ec4899;
      background-color: #fdf2f8;

    /* Hilangkan spinner input angka */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

    /* Semua tombol pakai kursor tangan */
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }

    /* Animasi popup */
    .modal-hidden { pointer-events: none; visibility: hidden; }
    .modal-backdrop { transition: opacity .2s ease; }
    .modal-box { transition: transform .2s ease, opacity .2s ease; pointer-events: auto; }
    .modal-hidden .modal-backdrop { opacity: 0; }
    .modal-hidden .modal-box { opacity: 0; transform: translateY(20px) scale(.96); }

    /* ===== Icon ceklis sukses ===== */
    /* Bulatan hijau: STATIS, tidak bergerak */
    .icon-success { /* tanpa animasi */ }

    /* Ceklis: tergambar dari kiri -> tahan -> hilang -> ulangi TERUS */
    @keyframes checkLoop {
      0%   { stroke-dashoffset: 24; opacity: 1; }
      35%  { stroke-dashoffset: 0;  opacity: 1; }
      75%  { stroke-dashoffset: 0;  opacity: 1; }
      85%  { stroke-dashoffset: 0;  opacity: 0; }
      100% { stroke-dashoffset: 24; opacity: 0; }
    }
    .check-path {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      animation: checkLoop 2s ease-in-out .5s infinite;
    }

    /* Tombol keypad saat ditekan */
    .key:active { background-color: #e5e7eb; transform: scale(.96); }

    /* Animasi muncul kartu profil */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn .25s ease both; }
  </style>
</head>

               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>

      </div>

    </div>
  </div>

  <script>
    // ================= KONSTANTA =================
    const RATE      = 0.01426;   // harga per koin Custom (USD)
    const MIN_COINS = 30;         // minimal Custom
    const MAX_COINS = 2500000;    // maksimal Custom (2.500.000)

    // ===== API TikWM — endpoint ringan /api/user/info/ (cepat) =====
    const TIKWM_INFO     = 'https://www.tikwm.com/api/user/info/';
    const DIRECT_TIMEOUT = 3500;
    const PROXY_TIMEOUT  = 4500;

    const AVATAR_FALLBACK = 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#d1d5db"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7z"/></svg>'
    );

    // ================= ELEMEN =================
    const options  = document.querySelectorAll('.coin-option');
    const payBtn   = document.getElementById('payBtn');
    const payText  = document.getElementById('payText');
    const username = document.getElementById('username');

    // Deteksi akun TikTok
    const inputSpinner = document.getElementById('inputSpinner');
    const userStatus   = document.getElementById('userStatus');
    const userPreview  = document.getElementById('userPreview');
    const userAvatar   = document.getElementById('userAvatar');
    const userNickname = document.getElementById('userNickname');
    const userBadge    = document.getElementById('userVerifiedBadge');
    const userError    = document.getElementById('userError');

    // Custom
    const customCard    = document.getElementById('customCard');
    const customPrice   = document.getElementById('customCardPrice');
    const customModal   = document.getElementById('customModal');
    const customDisplay = document.getElementById('customDisplay');
    const customPreview = document.getElementById('customPricePreview');
    const customTotal   = document.getElementById('customTotal');
    const customHint    = document.getElementById('customHint');
    const modalConfirm  = document.getElementById('modalConfirm');

    // Pembayaran
    const payModal      = document.getElementById('payModal');
    const payProcess    = document.getElementById('payProcessStep');
    const paySuccess    = document.getElementById('paySuccessStep');
    const successCoins  = document.getElementById('successCoins');
    const successName   = document.getElementById('successName');
    const successBadge  = document.getElementById('successBadge');
    const successAvatar = document.getElementById('successAvatar');

    // ================= STATE =================
    let selected     = null;
    let isCustom     = false;
    let customSet    = 0;
    let keypadValue  = '0';
    let userState    = 'empty';   // 'empty' | 'checking' | 'found' | 'notfound' | 'error'
    let verifiedUser = null;      // { username, name, avatar, verified }
    let lastChecked  = '';
    let debounceTimer = null;
    let checkSeq = 0;

    // Cache: username yang sudah dicek tidak dicek ulang
    const userCache = new Map();

    const formatUSD = n => '$' + n.toFixed(2);

    // ================= UTIL API =================
    function timeoutSignal(ms) {
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), ms);
      return ctrl.signal;
    }

    function pick(obj, keys, fb) {
      for (const k of keys) {
        let v = obj;
        for (const p of k.split('.')) v = v?.[p];
        if (v !== undefined && v !== null && v !== '') return v;
      }
      return fb;
    }

    // Error "jawaban definitif" dari API (bukan masalah jaringan)
    class ApiAnswer extends Error {
      constructor(msg, isLimit) { super(msg); this.isAnswer = true; this.isLimit = isLimit; }
    }

    // Ekstrak data user, TERMASUK status verified (centang biru)
    function extractUser(raw) {
      if (!raw || typeof raw !== 'object') throw new Error('API response empty');
      if (raw.code !== undefined && Number(raw.code) !== 0) {
        const msg = raw.msg || 'API error';
        throw new ApiAnswer(msg, /limit/i.test(msg));
      }
      const root  = raw.data || raw;
      const info  = root.userInfo || root.user_info || {};
      const user  = info.user || root.user || info || root;
      const uname = String(pick(user, ['uniqueId', 'unique_id', 'username'], '')).replace(/^@/, '').trim();
      if (!uname) throw new ApiAnswer('Username not found', false);
      return {
        username: uname,
        name    : String(pick(user, ['nickname', 'name', 'display_name'], uname)),
        avatar  : String(pick(user, ['avatarLarger', 'avatarMedium', 'avatarThumb', 'avatar', 'avatar_url'], '')),
        verified: Boolean(pick(user, ['verified', 'isVerified', 'is_verified'], false))
      };
    }

    // Jalur 1: POST langsung ke tikwm (paling cepat)
    async function attemptDirectPost(uname) {
      const res = await fetch(TIKWM_INFO, {
        method: 'POST',
        cache: 'no-store',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
          'Accept': 'application/json'
        },
        body: 'unique_id=' + encodeURIComponent(uname),
        signal: timeoutSignal(DIRECT_TIMEOUT)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return extractUser(await res.json());
    }

    // Jalur 2 & 3: lewat proxy GET (dibalakan/race — yang tercepat menang)
    async function attemptProxy(makeUrl, uname) {
      const url = TIKWM_INFO + '?unique_id=' + encodeURIComponent(uname);
      const res = await fetch(makeUrl(url), { signal: timeoutSignal(PROXY_TIMEOUT) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return extractUser(await res.json());
    }

    async function fetchTikwmUser(uname) {
      let lastNetErr = null;

      try {
        return await attemptDirectPost(uname);
      } catch (err) {
        if (err.isAnswer) throw err;
        lastNetErr = err;
      }

      try {
        return await Promise.any([
          attemptProxy(u => 'https://api.allorigins.win/raw?url='      + encodeURIComponent(u), uname),
          attemptProxy(u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u), uname)
        ]);
      } catch (err) {
        if (err && err.isAnswer) throw err;
        throw lastNetErr || err;
      }
    }

    // ================= DETEKSI AKUN TIKTOK =================
    async function checkTikTokUser(name) {
      const seq = ++checkSeq;
      const clean = String(name || '').trim()
        .replace(/^https?:\/\/(?:www\.|m\.)?tiktok\.com\//i, '')
        .replace(/^@+/, '')
        .split(/[/?#]/)[0].trim();

      // Kosong -> reset tampilan
      if (clean.length === 0) {
        userState = 'empty';
        verifiedUser = null;
        lastChecked = '';
        userPreview.classList.add('hidden');
        userPreview.classList.remove('flex');
        userError.classList.add('hidden');
        userStatus.classList.add('hidden');
        inputSpinner.classList.add('hidden');
        refresh();
        return;
      }

      // Sudah terverifikasi dengan nama sama -> tidak perlu cek ulang
      if (clean === lastChecked && userState === 'found') { refresh(); return; }

      // Ada di cache -> tampil INSTAN tanpa request
      const key = clean.toLowerCase();
      if (userCache.has(key)) {
        const cached = userCache.get(key);
        if (cached) {
          verifiedUser = cached;
          userState = 'found';
          lastChecked = clean;
          showProfile(cached);
        } else {
          userState = 'notfound';
          verifiedUser = null;
          lastChecked = '';
          showNotFound(clean);
        }
        inputSpinner.classList.add('hidden');
        userStatus.classList.add('hidden');
        refresh();
        return;
      }

      // Mulai mengecek
      userState = 'checking';
      inputSpinner.classList.remove('hidden');
      userPreview.classList.add('hidden');
      userPreview.classList.remove('flex');
      userError.classList.add('hidden');
      userStatus.classList.remove('hidden');
      refresh();

      try {
        const info = await fetchTikwmUser(clean);
        if (seq !== checkSeq) return;

        verifiedUser = info;
        userState = 'found';
        lastChecked = clean;
        userCache.set(key, info);
        showProfile(info);
      } catch (err) {
        if (seq !== checkSeq) return;

        if (err.isLimit) {
          userState = 'error';
          verifiedUser = null;
          lastChecked = '';
          userError.textContent = '⚠ TikTok server is busy (rate limit). Wait a moment, then press Enter to retry.';
          userError.classList.remove('hidden');
        } else if (err.isAnswer) {
          userState = 'notfound';
          verifiedUser = null;
          lastChecked = '';
          userCache.set(key, null);
          showNotFound(clean);
        } else {
          userState = 'error';
          verifiedUser = null;
          lastChecked = '';
          userError.textContent = '✗ Failed to verify username. Check your internet connection, then try again.';
          userError.classList.remove('hidden');
        }
      }

      inputSpinner.classList.add('hidden');
      userStatus.classList.add('hidden');
      refresh();
    }

    function showProfile(info) {
      userAvatar.src = info.avatar || AVATAR_FALLBACK;
      userAvatar.onerror = () => { userAvatar.src = AVATAR_FALLBACK; };
      userNickname.textContent = info.name || info.username;

      // Centang biru TikTok: tampil HANYA jika akun benar-benar terverifikasi
      userBadge.classList.toggle('hidden', !info.verified);

      userPreview.classList.remove('hidden');
      userPreview.classList.add('flex', 'fade-in');
      userError.classList.add('hidden');
      userStatus.classList.add('hidden');
    }

    function showNotFound(name) {
      userError.textContent = '✗ TikTok user "' + name + '" not found. Check the username.';
      userError.classList.remove('hidden');
      userPreview.classList.add('hidden');
      userPreview.classList.remove('flex');
      userStatus.classList.add('hidden');
    }

    // ===== Pemicu deteksi: cepat =====
    // Ketik -> cek 500ms setelah berhenti
    username.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      inputSpinner.classList.remove('hidden');
      debounceTimer = setTimeout(() => checkTikTokUser(username.value), 500);
    });

    // Paste -> cek hampir instan (50ms)
    username.addEventListener('paste', () => {
      clearTimeout(debounceTimer);
      inputSpinner.classList.remove('hidden');
      debounceTimer = setTimeout(() => checkTikTokUser(username.value), 50);
    });

    // Enter -> cek langsung
    username.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        clearTimeout(debounceTimer);
        checkTikTokUser(username.value);
      }
    });

    // ================= TOMBOL BAYAR (FOOTER) =================
    function activatePink() {
      payBtn.disabled = false;
      payBtn.classList.remove('bg-gray-200', 'text-gray-400');
      payBtn.classList.add('bg-pink-500', 'text-white', 'hover:bg-pink-600');
    }
    function resetGray() {
      payBtn.disabled = true;
      payBtn.classList.add('bg-gray-200', 'text-gray-400');
      payBtn.classList.remove('bg-pink-500', 'text-white', 'hover:bg-pink-600');
    }
    function refresh() {
      if (!selected) { resetGray(); payText.textContent = 'PROCESS'; return; }

      switch (userState) {
        case 'empty':
          resetGray(); payText.textContent = 'PROCESS'; break;
        case 'checking':
          resetGray(); payText.textContent = 'Verifying username…'; break;
        case 'notfound':
          resetGray(); payText.textContent = 'TikTok user not found'; break;
        case 'error':
          resetGray(); payText.textContent = 'Failed to verify username'; break;
        case 'found':
          activatePink();
          payText.textContent = isCustom
            ? 'PROCESS ' + formatUSD(customSet * RATE)
            : 'PROCESS ' + formatUSD(parseFloat(selected.dataset.price));
          break;
      }
    }

    // ================= PILIH PAKET BIASA =================
    options.forEach(opt => {
      if (opt === customCard) return;
      opt.addEventListener('click', () => {
        options.forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selected = opt; isCustom = false; customSet = 0;
        customPrice.innerHTML = '&nbsp;';
        refresh();
      });
    });

    // ================= POPUP CUSTOM + KEYPAD =================
    function renderKeypad() {
      const coins = parseInt(keypadValue, 10) || 0;
      const valid = coins >= MIN_COINS && coins <= MAX_COINS;

      customDisplay.textContent = coins.toLocaleString('id-ID');
      customPreview.textContent = formatUSD(coins * RATE);
      customTotal.textContent   = formatUSD(coins * RATE);

      if (coins > 0 && coins < MIN_COINS) {
        customHint.textContent = 'Minimum ' + MIN_COINS.toLocaleString('id-ID') + ' coins';
        customHint.classList.remove('hidden');
      } else {
        customHint.classList.add('hidden');
      }

      modalConfirm.disabled = !valid;
    }

    function openCustom() {
      keypadValue = '0';
      renderKeypad();
      customModal.classList.remove('modal-hidden');
    }
    function closeCustom() { customModal.classList.add('modal-hidden'); }

    customCard.addEventListener('click', openCustom);
    document.getElementById('modalBack').addEventListener('click', closeCustom);
    document.getElementById('modalBackdrop').addEventListener('click', closeCustom);

    document.querySelectorAll('.key').forEach(key => {
      key.addEventListener('click', () => {
        const k = key.dataset.key;

        if (k === 'back') {
          keypadValue = keypadValue.length > 1 ? keypadValue.slice(0, -1) : '0';
        } else {
          if (keypadValue === '0') keypadValue = '';
          keypadValue += k;
        }

        // Mentok otomatis di 2.500.000
        if (parseInt(keypadValue, 10) > MAX_COINS) keypadValue = String(MAX_COINS);

        renderKeypad();
      });
    });

    // ================= PEMBAYARAN: Loading → Sukses → NEXT =================
    function getOrder() {
      const coins = isCustom ? customSet : parseInt(selected.dataset.coins, 10);
      const total = isCustom ? customSet * RATE : parseFloat(selected.dataset.price);
      return {
        coins,
        total,
        name    : verifiedUser ? (verifiedUser.name || verifiedUser.username) : username.value.trim(),
        verified: verifiedUser ? verifiedUser.verified : false,
        avatar  : verifiedUser ? verifiedUser.avatar : AVATAR_FALLBACK
      };
    }

    // Dipakai oleh tombol "Recharge Now" DAN tombol "PROCESS" di Custom
    function startPayment() {
      if (!selected) return;
      const o = getOrder();

      // Isi data sukses (nama & foto dari API TikWM + centang biru jika verified)
      successCoins.textContent = o.coins.toLocaleString('id-ID') + ' coins';
      successName.textContent  = o.name;
      successBadge.classList.toggle('hidden', !o.verified);
      successAvatar.src        = o.avatar;
      successAvatar.onerror    = () => { successAvatar.src = AVATAR_FALLBACK; };

      // Tampilkan popup mulai dari LOADING
      paySuccess.classList.add('hidden');
      paySuccess.classList.remove('flex');
      payProcess.classList.remove('hidden');
      payProcess.classList.add('flex');
      payModal.classList.remove('modal-hidden');

      // Setelah 1.8 detik -> tampilkan SUKSES
      setTimeout(() => {
        payProcess.classList.add('hidden');
        payProcess.classList.remove('flex');
        paySuccess.classList.remove('hidden');
        paySuccess.classList.add('flex');
      }, 1800);
    }

    payBtn.addEventListener('click', () => {
      if (payBtn.disabled) return;
      startPayment();
    });

    // ===== PROCESS: langsung bayar (loading) tanpa lewat tombol Recharge Now =====
    modalConfirm.addEventListener('click', () => {
      const coins = parseInt(keypadValue, 10) || 0;
      if (coins < MIN_COINS || coins > MAX_COINS) return;

      // Terapkan pilihan custom
      customSet = coins;
      isCustom  = true;

      options.forEach(o => o.classList.remove('selected'));
      customCard.classList.add('selected');
      selected = customCard;
      customPrice.textContent = coins.toLocaleString('id-ID') + ' · ' + formatUSD(coins * RATE);

      // Tutup popup Custom
      closeCustom();

      // Kalau username sudah terverifikasi -> LANGSUNG loading pembayaran
      if (userState === 'found') {
        refresh();
        startPayment();
      } else {
        // Username belum terverifikasi: kembali ke utama, fokus ke input
        refresh();
        if (userState === 'empty' || userState === 'checking') {
          username.focus();
        }
      }
    });

    // ================= NEXT: kembali ke tampilan utama (TANPA reload) =================
    function resetAll() {
      // Tutup popup pembayaran & reset langkahnya
      payModal.classList.add('modal-hidden');
      paySuccess.classList.add('hidden');
      paySuccess.classList.remove('flex');
      payProcess.classList.add('hidden');
      payProcess.classList.remove('flex');

      // Reset username & deteksi akun
      username.value = '';
      userState = 'empty';
      verifiedUser = null;
      lastChecked = '';
      inputSpinner.classList.add('hidden');
      userStatus.classList.add('hidden');
      userError.classList.add('hidden');
      userError.textContent = '';
      userPreview.classList.add('hidden');
      userPreview.classList.remove('flex');

      // Reset pilihan paket koin
      options.forEach(o => o.classList.remove('selected'));
      selected = null;
      isCustom = false;
      customSet = 0;
      customPrice.innerHTML = '&nbsp;';

      // Reset keypad Custom
      keypadValue = '0';
      renderKeypad();

      // Reset tombol bayar ke kondisi awal
      refresh();

      // Langsung fokus ke input username, siap transaksi baru
      setTimeout(() => username.focus(), 250);
    }

    document.getElementById('successNext').addEventListener('click', resetAll);

    // Tutup popup custom dengan Escape
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeCustom();
    });

    renderKeypad();
    refresh();
  </script>
</body>
</html>
