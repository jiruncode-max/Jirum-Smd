<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tep² &amp; Posting Ulang</title>
    <!-- Tailwind CSS for styling support -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', serif;
            background-color: #000000;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes blinkEffect {
            0%, 100% {
                opacity: 0;
                transform: scale(0.97);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .blinking-text {
            /* Jeda hilang-muncul 1 detik */
            animation: blinkEffect 1s infinite ease-in-out;
            
            /* Warna teks bagian dalam */
            color: #FFE600; 
            
            /* Membuat garis pinggir (outline) putih yang solid dan tajam */
            -webkit-text-stroke: 2px #FFFFFF;
            text-stroke: 2px #FFFFFF;
            
            /* Bayangan lembut di belakang agar teks terlihat lebih tebal dan keluar */
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.6);
                 
            font-style: italic;
            font-weight: 900;
            text-align: center;
            user-select: none;
            line-height: 1.2;
        }

        .blinking-text sup {
            font-size: 0.6em;
            vertical-align: super;
            -webkit-text-stroke: 1.5px #FFFFFF;
            text-stroke: 1.5px #FFFFFF;
        }
    </style>
</head>
<body>

    <main>
        <h1 class="blinking-text text-3xl sm:text-4xl md:text-5xl">
            Tep<sup>2</sup> &amp; Posting Ulang
        </h1>
    </main>

</body>
</html>
